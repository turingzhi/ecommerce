name: Ecommerce

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Ecommerce.csproj
      - name: Build
        run: dotnet build Ecommerce.csproj --no-restore
      - name: Verify
        run: dotnet run --project Ecommerce.csproj --no-build -- --verify
